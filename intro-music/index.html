<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hiring Training Intro</title>

<style>
:root {
    --navy: #12355b;
    --blue: #0b568f;
    --gold: #f2c14e;
    --cream: #fff9e8;
    --text: #1f2933;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        linear-gradient(
            rgba(18, 53, 91, .72),
            rgba(18, 53, 91, .72)
        ),
        linear-gradient(
            135deg,
            #0b568f,
            #12355b 55%,
            #5e438d
        );
}

.screen {
    width: min(760px, calc(100% - 32px));
    padding: 34px 30px;
    text-align: center;
    background: var(--cream);
    border: 6px solid var(--navy);
    box-shadow:
        0 0 0 6px var(--gold),
        12px 12px 0 rgba(0, 0, 0, .25);
}

.eyebrow {
    margin: 0 0 8px;
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
}

h1 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.1;
}

.subtitle {
    margin: 0 0 28px;
    color: #4b5b68;
    font-size: 18px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    min-height: 48px;
    padding: 12px 20px;
    border: 3px solid var(--navy);
    border-radius: 4px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.primary {
    background: var(--navy);
    color: var(--white);
}

.secondary {
    background: var(--white);
    color: var(--navy);
}

button:hover,
button:focus-visible {
    outline: 4px solid var(--gold);
    outline-offset: 3px;
}

.status {
    margin: 24px 0 0;
    min-height: 28px;
    color: #4b5b68;
    font-size: 14px;
}

.progress {
    width: 100%;
    height: 10px;
    margin: 18px 0 0;
    overflow: hidden;
    background: #d9e1e7;
    border: 2px solid var(--navy);
}

.progress-bar {
    width: 0;
    height: 100%;
    background: var(--gold);
}

.playing .progress-bar {
    animation: fill 10.2s linear forwards;
}

.pixel-row {
    display: flex;
    justify-content: center;
    gap: 5px;
    height: 26px;
    margin: 22px 0 0;
    align-items: flex-end;
}

.pixel {
    width: 10px;
    height: 8px;
    background: var(--blue);
}

.playing .pixel:nth-child(1) {
    animation: bounce .35s infinite alternate;
}

.playing .pixel:nth-child(2) {
    animation: bounce .5s infinite alternate;
}

.playing .pixel:nth-child(3) {
    animation: bounce .28s infinite alternate;
}

.playing .pixel:nth-child(4) {
    animation: bounce .42s infinite alternate;
}

.playing .pixel:nth-child(5) {
    animation: bounce .34s infinite alternate;
}

@keyframes bounce {
    from {
        height: 7px;
    }

    to {
        height: 25px;
    }
}

@keyframes fill {
    from {
        width: 0;
    }

    to {
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .pixel,
    .progress-bar {
        animation: none !important;
    }
}
</style>
</head>

<body>

<main
    class="screen"
    id="screen"
    aria-labelledby="title">

    <p class="eyebrow">
        GREAT FALLS COLLEGE
    </p>

    <h1 id="title">
        Hiring Training
    </h1>

    <p class="subtitle">
        Your Search Committee Quest Begins
    </p>

    <div class="controls">

        <button
            id="startButton"
            class="primary"
            type="button">
            ▶ Start Training
        </button>

        <button
            id="skipButton"
            class="secondary"
            type="button">
            Skip Intro →
        </button>

    </div>

    <div
        class="pixel-row"
        aria-hidden="true">

        <span class="pixel"></span>
        <span class="pixel"></span>
        <span class="pixel"></span>
        <span class="pixel"></span>
        <span class="pixel"></span>

    </div>

    <div
        class="progress"
        aria-hidden="true">

        <div class="progress-bar"></div>

    </div>

    <p
        id="status"
        class="status"
        aria-live="polite">
        Select Start Training to play the intro.
    </p>

</main>

<script>
(function () {

    const nextPage =
        "https://gfcmsu.instructure.com/courses/5243/pages/about-our-class-2?module_item_id=677112";

    const screen =
        document.getElementById('screen');

    const startButton =
        document.getElementById('startButton');

    const skipButton =
        document.getElementById('skipButton');

    const status =
        document.getElementById('status');

    let context = null;
    let activeNodes = [];
    let redirectTimer = null;
    let started = false;

    function goToCanvas() {

        stopAudio();

        window.location.href =
            nextPage;
    }

    function createContext() {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        return new AudioContext();
    }

    function playNote(
        frequency,
        start,
        duration,
        type,
        volume
    ) {

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            start
        );

        gain.gain.setValueAtTime(
            0.0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            start + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            start + duration
        );

        oscillator
            .connect(gain)
            .connect(context.destination);

        oscillator.start(start);

        oscillator.stop(
            start + duration + 0.03
        );

        activeNodes.push(
            oscillator
        );
    }

    function melody(
        frequency,
        start,
        duration
    ) {

        playNote(
            frequency,
            start,
            duration,
            'square',
            0.035
        );

        playNote(
            frequency * 2,
            start,
            duration * 0.75,
            'sine',
            0.018
        );
    }

    function bass(
        frequency,
        start,
        duration
    ) {

        playNote(
            frequency,
            start,
            duration,
            'triangle',
            0.05
        );
    }

    function bell(
        frequency,
        start,
        duration
    ) {

        playNote(
            frequency,
            start,
            duration,
            'sine',
            0.04
        );
    }

    function startIntro() {

        if (started) {
            return;
        }

        started = true;

        context =
            createContext();

        const now =
            context.currentTime + 0.05;

        const melodyNotes = [

            [523.25, 0.00, .35],
            [659.25, 0.42, .35],
            [783.99, 0.84, .50],
            [659.25, 1.40, .32],

            [698.46, 1.78, .35],
            [783.99, 2.20, .35],
            [880.00, 2.62, .60],

            [783.99, 3.34, .30],
            [659.25, 3.70, .30],
            [587.33, 4.06, .38],
            [659.25, 4.50, .55],

            [523.25, 5.18, .30],
            [659.25, 5.54, .30],
            [783.99, 5.90, .35],
            [987.77, 6.34, .60],

            [880.00, 7.06, .32],
            [783.99, 7.44, .32],
            [659.25, 7.82, .38],

            [783.99, 8.30, .30],
            [987.77, 8.66, .30],
            [1046.50, 9.02, .80]

        ];

        melodyNotes.forEach(
            function (note) {

                melody(
                    note[0],
                    now + note[1],
                    note[2]
                );

            }
        );

        const bassNotes = [

            [130.81, 0.00],
            [174.61, 1.20],
            [196.00, 2.40],
            [174.61, 3.60],
            [130.81, 4.80],
            [174.61, 6.00],
            [196.00, 7.20],
            [130.81, 8.40]

        ];

        bassNotes.forEach(
            function (note) {

                bass(
                    note[0],
                    now + note[1],
                    1.05
                );

            }
        );

        const arpeggio = [
            261.63,
            329.63,
            392.00,
            329.63
        ];

        for (let i = 0; i < 32; i++) {

            bell(
                arpeggio[i % 4],
                now + i * .30,
                .18
            );
        }

        bell(
            523.25,
            now + 9.35,
            .55
        );

        bell(
            659.25,
            now + 9.47,
            .55
        );

        bell(
            783.99,
            now + 9.59,
            .75
        );

        screen.classList.add(
            'playing'
        );

        startButton.disabled =
            true;

        startButton.textContent =
            'Intro Playing...';

        status.textContent =
            'Opening Hiring Training...';

        redirectTimer =
            setTimeout(
                goToCanvas,
                10300
            );
    }

    function stopAudio() {

        if (redirectTimer) {

            clearTimeout(
                redirectTimer
            );

            redirectTimer =
                null;
        }

        activeNodes.forEach(
            function (node) {

                try {
                    node.stop();
                } catch (error) {
                }

            }
        );

        activeNodes = [];

        if (context) {

            try {
                context.close();
            } catch (error) {
            }

            context = null;
        }
    }

    startButton.addEventListener(
        'click',
        startIntro
    );

    skipButton.addEventListener(
        'click',
        goToCanvas
    );

})();
</script>

</body>
</html>
